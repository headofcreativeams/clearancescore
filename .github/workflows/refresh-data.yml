name: Refresh live data

# Runs on a schedule and re-fetches the same public sources the old Express
# server called on every request (Google News RSS, IPWatchdog, CourtListener),
# then commits the results as static JSON. GitHub Pages has no server process,
# so this scheduled job is what keeps the "live" feed and case-law lookups
# actually current instead of frozen at the last deploy.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Fetch fresh data
        run: npx tsx scripts/fetch-static-data.ts
      - name: Commit updated data
        run: |
          git config user.name "clearancescore-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add client/public/data
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "chore: refresh live data snapshot [skip ci-build]"
            git push
          fi
